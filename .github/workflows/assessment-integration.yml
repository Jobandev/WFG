name: Website assessment integration
on:
  push:
    branches: [feat/whsms-assessment-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-assessments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      # Full cross-repository E2E runs in the private WHSMS repository.
      # No cross-repository secret or private backend checkout belongs here.
